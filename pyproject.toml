[project]
name = "data-anonymizer"
version = "0.1.0"
description = "Detect sensitive columns, propose and apply masking, noise and anonymization techniques, and generate synthetic data from a schema or a sample."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rodrigo Monteiro Pereira", email = "rmonteiropereira1@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "bcrypt>=4.1",
    "cryptography>=42",
    "faker>=24.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "scipy>=1.11",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0"]

[project.scripts]
anonymize = "data_anonymizer.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pandas-stubs>=2.1",
    "pytest>=8.3.5",
    "ruff>=0.11.6",
    "scipy-stubs>=1.18.1.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
testpaths = ["tests"]
