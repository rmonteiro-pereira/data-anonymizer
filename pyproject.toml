[project]
name = "oblitus"
version = "0.3.0"
description = "Detect sensitive columns, propose and apply masking, noise and anonymization techniques, and generate synthetic data from a schema or a sample."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rodrigo Monteiro Pereira", email = "rmonteiropereira1@gmail.com" }]
requires-python = ">=3.12"
keywords = [
    "anonymization",
    "pseudonymization",
    "privacy",
    "pii",
    "lgpd",
    "gdpr",
    "k-anonymity",
    "synthetic-data",
    "pandas",
    "polars",
    "duckdb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "argon2-cffi>=23.1",
    "bcrypt>=4.1",
    "cryptography>=42",
    "faker>=24.0",
    "narwhals>=2.27",
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=1.30",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "scipy>=1.11",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.3,<2"]
audio = ["sounddevice>=0.5"]
camera = ["opencv-python-headless>=4.9"]
opendp = ["opendp>=0.16"]

[project.urls]
Homepage = "https://github.com/rmonteiro-pereira/oblitus"
Documentation = "https://github.com/rmonteiro-pereira/oblitus#readme"
Changelog = "https://github.com/rmonteiro-pereira/oblitus/blob/main/CHANGELOG.md"
Issues = "https://github.com/rmonteiro-pereira/oblitus/issues"

[project.scripts]
oblitus = "oblitus.cli:main"

[dependency-groups]
dev = [
    "duckdb>=1.3,<2",
    "mypy>=1.15.0",
    "pandas-stubs>=2.1",
    "pytest>=8.3.5",
    "ruff>=0.11.6",
    "scipy-stubs>=1.18.1.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oblitus = ["noise_explorer/template.html"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
testpaths = ["tests"]
